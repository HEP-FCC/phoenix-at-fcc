name: Deploy to GitHub Pages as prod

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: yarn install --immutable
      - run: yarn build:prod
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/phoenix-at-fcc
          clean-exclude: |
            dev
